[package]
name = "optimization"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
clippy.perf = "deny"

[dependencies]
derive_more = { version = "2.0.1", features = ["constructor", "from"] }
nalgebra = { version = "0.33.2", features= ["rand"] }
num = "0.4.0"
